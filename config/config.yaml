crawler:
  parallelism: 10
  worker: 10
  idleTime: 5

spiders:
  douban-movie:
    entry: "home"
    rules:
      home:
        - selector: "#nowplaying .list-item"
          category: "正在热映"
          fields:
            标题: "data-title"
            评分: "data-score"
            收藏: "data-star"
            发布时间: "data-release"
            时长: "data-duration"
            地区: "data-region"
            分类: "data-category"
            导演: "data-director"
            演员: "data-actors"
        - selector: "#upcoming .list-item"
          category: "即将上映"
          fields:
            标题: "data-title"
            评分: "data-score"
            收藏: "data-star"
            发布时间: "data-release"
            时长: "data-duration"
            地区: "data-region"
            分类: "data-category"
            导演: "data-director"
            演员: "data-actors"

tasks:
  - url: "https://movie.douban.com/cinema/nowplaying/shanghai/"
    method: "GET"
    spider: "douban-movie"
    rule: "home"
    priority: 0
    enableCookie: false
    redirectTimes: -1
    dialTimeout: 5
    connTimeout: 5
    retry:
      times: 3
      interval: 3
